; =====================================================================================
; PlatformIO Project Configuration File for Farm Bot ESP32 Node
; =====================================================================================
; Open this project folder in VS Code with PlatformIO extension installed.
; PlatformIO will automatically install ESP32 toolchains and libraries.
; =====================================================================================

[platformio]
default_envs = esp32dev
src_dir = esp32_farm_bot

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Automatically download required Arduino libraries for ESP32
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
